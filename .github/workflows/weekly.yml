name: Weekly hotel reporting (safe preview)
on:
  workflow_dispatch:
  schedule:
    - cron: '0 1 * * 1'  # Monday 09:00 Asia/Kuala_Lumpur (UTC+8; no DST)
permissions:
  contents: read
jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - name: Preview reports from Google Sheets
        env:
          DATA_SOURCE: sheets
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          SEND_ENABLED: 'false'
        run: |
          # Use ISO previous week as explicit report label (source does not have dates).
          python -c 'from datetime import date,timedelta; d=date.today()-timedelta(days=7); y,w,_=d.isocalendar(); print(f"{y}-W{w:02d}")' > period.txt
          python main.py --source sheets --period "$(cat period.txt)"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: preview-reports
          path: previews/
